name: ios

# 只跑两件事：数据层单测 + 出未签名 ipa。
# 未签名包不能直接装，要用 Sideloadly / AltStore 用自己的 Apple ID 重签后侧载。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 数据层单测
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      - name: swift test
        run: swift test --parallel

  build:
    name: 编译未签名 ipa
    runs-on: macos-15
    # 发布 Release 需要写权限；仓库默认的 GITHUB_TOKEN 只读
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          echo "===== 工程里可用的 scheme ====="
          xcodebuild -list -project Daka.xcodeproj

      - name: 编译（关掉签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Daka.xcodeproj \
            -scheme Daka \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      # 公开仓库的 job 日志要登录才能下载，但 ::error:: 注解是匿名可读的。
      # 把编译错误挤进注解里，排查时不用手工复制日志。
      - name: 编译失败时把错误贴出来
        if: failure()
        run: |
          echo "===== 编译错误 ====="
          grep -nE "(error:|fatal error:|BUILD FAILED|The following build commands failed|does not contain a scheme)" build.log 2>/dev/null | head -20 || true
          echo "===== 日志尾部 ====="
          tail -40 build.log 2>/dev/null || echo "(没有 build.log)"
          grep -E "(error:|fatal error:|BUILD FAILED|does not contain a scheme)" build.log 2>/dev/null | head -8 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          { echo "### 编译失败"; echo '```'; tail -60 build.log 2>/dev/null || echo "(没有 build.log)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 校验产物
        run: |
          APP=build/Build/Products/Release-iphoneos/Daka.app
          test -d "$APP" || { echo "没找到 Daka.app"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'

      - name: 打包成未签名 ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Daka.app out/Payload/
          cd out && zip -qry ../Daka-unsigned.ipa Payload
          ls -lh ../Daka-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Daka-unsigned-ipa
          path: Daka-unsigned.ipa
          if-no-files-found: error

      # main 上构建成功就把包挂到 tag 为 latest 的 Release 上，
      # 得到一个不会漂移的固定直链：
      # https://github.com/xing-patrick/daka-ios/releases/latest/download/Daka-unsigned.ipa
      - name: 发布到 Release（仅 main 分支的 push）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Daka-unsigned.ipa --clobber
          else
            gh release create latest Daka-unsigned.ipa \
              --title "最新构建" \
              --notes "由 GitHub Actions 自动构建，**未签名**。装到手机需要用 Sideloadly / AltStore 以自己的 Apple ID 重签。" \
              --prerelease
          fi
          gh release view latest --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
