# XcodeGen 工程定义：不手写 .xcodeproj，改这里再 `xcodegen generate`。
#
# App target 直接把 Sources/DakaCore 编译进来（同一个 module Daka），
# Package.swift 只服务于 `swift test` 跑纯逻辑单测，两套构建互不干扰。
name: Daka

options:
  bundleIdPrefix: com.daka
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Daka:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Sources/DakaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daka.reminder
        PRODUCT_NAME: Daka
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        # 侧载阶段由 Sideloadly / AltStore 用个人免费证书重签，
        # 这里留空，CI 上再用 CODE_SIGNING_ALLOWED=NO 关掉签名。
        DEVELOPMENT_TEAM: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 打卡提醒
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        # iOS 26 起用 AlarmKit 走系统闹钟；低版本降级成本地通知，不需要这个 key
        NSAlarmKitUsageDescription: 到点用系统闹钟提醒你打卡，静音和专注模式下也能响。
